.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:18px;font-variant-numeric:tabular-nums}

.bar{position:relative;width:180px;height:12px}.bar i{position:absolute;top:5px;height:2px;background:var(--fg2)}.bar b{position:absolute;top:2px;width:8px;height:8px;border-radius:50%;background:var(--fg);margin-left:-4px}

</style>

ods":["astra_low","astra_high","astra_max","opus_low","opus_high","opus_xhigh","argon_low","argon_medium","argon_high","glm","kimi","deepseek","qwenflash","qwen27","gemma"]},{"id":"d593a4f87a","cat":"multi/complex","views":14,"methods":["astra_low","astra_high","astra_max","opus_low","opus_high","opus_xhigh","argon_low","argon_medium","argon_high","glm","kimi","deepseek","qwenflash","qwen27","gemma"]},{"id":"a31b2ef388","cat":"multi/complex","views":10,"methods":["astra_low","astra_high","astra_max","opus_low","opus_high","opus_xhigh","argon_low","argon_medium","argon_high","glm","kimi","deepseek","qwenflash","qwen27","gemma"]}],"names":{"astra_low":"GPT-6 Astra (low)","astra_high":"GPT-6 Astra (high)","astra_max":"GPT-6 Astra (max)","opus_low":"Claude Opus 5.5 (low)","opus_high":"Claude Opus 5.5 (high)","opus_xhigh":"Claude Opus 5.5 (xhigh)","argon_low":"Gemini 4 Argon (low)","argon_medium":"Gemini 4 Argon (medium)","argon_high":"Gemini 4 Argon (high)","glm":"GLM-5.3 Flash (max)","kimi":"Kimi K3.1 Pro (max)","deepseek":"DeepSeek V4.1 Flash (max)","qwenflash":"Qwen3.8-Flash-Next (max)","qwen27":"Qwen3.8-27B (xhigh)","gemma":"Gemma 4 31B (high)"}};
const ASPECTS = [   // v2 (2026-11-04): four questions; Objects merges completeness and similarity. Keys kept so earlier votes still count.
 {k:'objects', n:'Objects', q:'Which reconstructs the objects in the photo more completely and more faithfully, with fewer missing, extra or wrong-looking ones?'},
 {k:'layout', n:'Layout', q:'Which places the objects and room surfaces more like the photo?'},
 {k:'image', n:'Appearance', q:'Which image as a whole looks more like the photo?'},
 {k:'overall', n:'Overall', q:'If you could keep only one reconstruction of this view, which would you keep?'}];
const QV = 2;
const SESSION = 30, PRIOR = 1;   // no side-swapped repeats (user, 2026-11-10)
/*ENGINE*/
// Rating: Gaussian (mean, variance) per aspect, scene and method, logistic win model; a tie counts as half a win.
function ratings(votes){
  const R = {}, get = (a,s,m) => (R[a+'|'+s+'|'+m] ??= {mu:0, v:PRIOR, n:0});
  for (const x of votes) for (const a of Object.keys(x.ans||{})) {
    const y = {a:1, b:0, s:.5}[x.ans[a]]; if (y===undefined) continue;
    const A = get(a,x.scene,x.a), B = get(a,x.scene,x.b), p = 1/(1+Math.exp(B.mu-A.mu)), I = p*(1-p), D = 1+(A.v+B.v)*I, e = y-p;
    const am = A.mu+A.v*e/D, bm = B.mu-B.v*e/D, av = A.v-A.v*A.v*I/D, bv = B.v-B.v*B.v*I/D;
    A.mu=am; B.mu=bm; A.v=Math.max(av,1e-3); B.v=Math.max(bv,1e-3); A.n++; B.n++;
  }
  return {R, get};
}
// Elo-style match: the least-played method of the least-played scene meets the method rated closest to it (jitter avoids everyone getting the same pair).
function nextPair(votes, stim, seen, rnd=Math.random){
  const {get} = ratings(votes), load = s => stim.scenes.find(x=>x.id===s);
  const cnt = {}; for (const s of stim.scenes) cnt[s.id]=0; for (const x of votes) if (x.scene in cnt) cnt[x.scene]++;
  const sc = [...stim.scenes].sort((p,q)=>cnt[p.id]-cnt[q.id]+(rnd()-.5))[0], ms = sc.methods;
  const a = [...ms].sort((p,q)=>get('overall',sc.id,p).n-get('overall',sc.id,q).n+rnd()*.5-.25)[0], ma = get('overall',sc.id,a).mu;
  const key = (p,q) => sc.id+'|'+[p,q].sort().join('|');
  const opp = ms.filter(m=>m!==a && !seen.has(key(a,m))), pool = opp.length?opp:ms.filter(m=>m!==a);
  const b = [...pool].sort((p,q)=>Math.abs(get('overall',sc.id,p).mu-ma)-Math.abs(get('overall',sc.id,q).mu-ma)+(rnd()-.5)*.3)[0];
  const uses = Array(sc.views).fill(0); for (const x of votes) if (x.scene===sc.id) uses[x.view]=(uses[x.view]||0)+1;
  const low = Math.min(...uses), vs = uses.map((u,i)=>u===low?i:-1).filter(i=>i>=0);
  return {scene:sc.id, a, b, view:vs[Math.floor(rnd()*vs.length)], left:rnd()<.5?'a':'b'};
}
function summary(votes, stim, aspect){
  const {get} = ratings(votes), ids = new Set(stim.scenes.flatMap(s=>s.methods));
  return [...ids].map(m => { const sc = stim.scenes.filter(s=>s.methods.includes(m)), r = sc.map(s=>get(aspect,s.id,m));
    return {m, mu:r.reduce((t,x)=>t+x.mu,0)/r.length, ci:1.96*Math.sqrt(r.reduce((t,x)=>t+x.v,0))/r.length, n:r.reduce((t,x)=>t+x.n,0), scenes:r.length}; }).sort((p,q)=>q.mu-p.mu);
}
/*END*/
let uid='', votes=[], name='Anonymous', S=null;
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

const viewsOf=sc=>STIM.scenes.find(s=>s.id===sc).views;
function render(){

function answer(a,v){ S.ans[a]=v; render(); }
async function submit(){
  if(ASPECTS.some(a=>!S.ans[a.k])) return;
  const t=S.t, flipV=v=>v==='s'?'s':(t.left==='a'?v:(v==='a'?'b':'a'));   // A / B on screen -> method a / b

async function finish(){ S=null; app.innerHTML=`<div class="card"><h2>Thank you</h2><p id="fs">Saving your answers…</p><div><button class="go" id="again">Do another round</button></div></div>`; $('again').onclick=start;

function start(){ pull(); S={done:0,hist:[],session:uid.slice(0,12)+'_'+Date.now()}; newTrial(); }
function intro(){
  app.innerHTML=`<div class="card"><h2>Compare 3D reconstructions with a photo</h2><p>Each screen shows one real photo of a room and two renders of 3D reconstructions from the same camera. Decide which render matches the photo better.</p>
  <ul><li>Four quick questions per screen, ${SESSION} screens, about 20 minutes.</li><li>Each screen is saved when you press Submit and next. You can stop at any time; coming back starts a new round.</li><li>Judge what you see. Render A and B change sides at random.</li><li>Pick About equal only when you truly cannot separate them.</li></ul>
  <label for="nm">Your name <input id="nm" maxlength="60" autocomplete="name"></label>
  <div><button class="go" id="st">Start</button></div>${EP?'':'<p class="note">The study is not open yet.</p>'}</div>`;
  $('nm').value=name; $('nm').oninput=e=>{name=e.target.value.trim()||'Anonymous'; save('rm_name',name);}; $('st').onclick=start; if(!EP) $('st').disabled=true; 
}
const S0={aspect:'overall'};
function route(){ if(!S) intro(); }
// lightbox: one zoom and pan shared by the three images
const L={z:1,x:0,y:0,i:0,on:false,w:0,h:0};
function openLB(i){ L.i=i; L.z=1; L.x=0; L.y=0; L.on=true; $('lb').hidden=false; const sl=slots();
  $('lbseg').innerHTML=sl.map((s,k)=>`<button data-l="${k}">${s.label}</button>`).join(''); $('lbseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{L.i=+b.dataset.l; drawLB();}); sizeLB(); }
function sizeLB(){ const v=$('lbv').getBoundingClientRect(); L.w=Math.min(v.width,v.height*1.5); L.h=L.w/1.5; const e=$('lbi'); e.style.width=L.w+'px'; e.style.height=L.h+'px'; drawLB(); }
function drawLB(){ const t=S.t,n=viewsOf(t.scene),e=$('lbi'),k=slots()[L.i].k; L.x=Math.min(0,Math.max(L.w-L.w*L.z,L.x)); L.y=Math.min(0,Math.max(L.h-L.h*L.z,L.y));
  e.style.backgroundImage=`url(${src(t.scene,k)})`; e.style.backgroundSize=`${L.w*L.z}px ${L.h*L.z*n}px`; e.style.backgroundPosition=`${L.x}px ${L.y-t.view*L.h*L.z}px`;
  $('zl').textContent=Math.round(L.z*100)+'%'; $('lbseg').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===L.i)); }
function zoom(f,cx=L.w/2,cy=L.h/2){ const z=Math.max(1,Math.min(6,L.z*f)), r=z/L.z; L.x=cx-(cx-L.x)*r; L.y=cy-(cy-L.y)*r; L.z=z; drawLB(); }
function closeLB(){ L.on=false; $('lb').hidden=true; }
$('zi').onclick=()=>zoom(1.5); $('zo').onclick=()=>zoom(1/1.5); $('zr').onclick=()=>{L.z=1;L.x=L.y=0;drawLB();}; $('lbx').onclick=closeLB;
$('lbi').addEventListener('wheel',e=>{e.preventDefault(); const b=e.currentTarget.getBoundingClientRect(); zoom(e.deltaY<0?1.2:1/1.2,e.clientX-b.left,e.clientY-b.top);},{passive:false});
let drag=null; $('lbi').addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lx:L.x,ly:L.y}; e.currentTarget.setPointerCapture(e.pointerId);});
$('lbi').addEventListener('pointermove',e=>{ if(!drag) return; L.x=drag.lx+e.clientX-drag.x; L.y=drag.ly+e.clientY-drag.y; drawLB();});
$('lbi').addEventListener('pointerup',()=>drag=null);
addEventListener('resize',()=>{if(L.on) sizeLB();});
addEventListener('hashchange',route);
name=load('rm_name')||'Anonymous'; uid=load('rm_uid')||(()=>{const u='r'+Math.random().toString(36).slice(2,12); save('rm_uid',u); return u;})();
route();
pull().then(()=>{ if(!S) route(); }); flush(); setInterval(()=>{ if(queue.length) flush(); },30000);
</script>
